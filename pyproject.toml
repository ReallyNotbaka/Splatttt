[project]
name = "arg"
version = "0.1.0"
description = "turn videos of any length into a 3d environment"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.4.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0,<2.3.0",
    "scipy>=1.13.0",
    "pillow>=10.3.0",
    "transformers>=4.44.0",
    "huggingface-hub>=0.24.0",
    "trimesh>=4.4.0",
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
    "PySide6>=6.7.0",
    "open3d>=0.20.0",
    "pycolmap>=4.2.1",
    "xatlas>=0.0.11",
    "fast-simplification>=0.2.0",
    "av>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:dash"

[tool.uv]
managed = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
